<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="carregarProdutos()">Carregar Produtos</button>

    <pre id="resultado">Clique no botão para carregar os produtos...</pre>


    <script>
        async function carregarProdutos(){
    try{
    const response = await fetch("https://dummyjson.com/products");
    
    console.log(response);

const dados = await response.json();
document.getElementById("resultado").textContent = JSON.stringify(dados, null, 4);
}

catch(erro){
    console.error(erro);
    document.getElementById("resultado").textContent = "Erro ao carregar os produtos";
}
}

    </script>
</body>
</html>
